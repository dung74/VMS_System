<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Hệ Thống An Ninh</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .auth-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }
        h2 { color: #0f172a; margin-top: 0; margin-bottom: 25px; font-size: 24px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { font-weight: bold; color: #475569; display: block; margin-bottom: 8px; font-size: 14px; }
        
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #10b981; /* Đổi viền focus sang xanh lá */
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .btn-submit { 
            width: 100%; 
            background: #10b981; /* Màu xanh lá cho nút đăng ký */
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px;
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #059669; }
        
        .switch-link { 
            margin-top: 20px; 
            display: inline-block; 
            color: #64748b; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500;
        }
        .switch-link:hover { color: #10b981; text-decoration: underline; }
        
        .error-box { 
            background-color: #fef2f2; 
            color: #dc2626; 
            border: 1px solid #fecaca;
            padding: 12px; 
            border-radius: 6px;
            font-size: 14px; 
            margin-bottom: 20px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>📝 Tạo Tài Khoản Mới</h2>
        
        {% if error_msg %}
            <div class="error-box">
                ⚠️ {{ error_msg }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Tên đăng nhập mong muốn:</label>
                <input type="text" name="username" placeholder="Nhập tên tài khoản..." required autofocus>
            </div>
            <div class="form-group">
                <label>Mật khẩu an toàn:</label>
                <input type="password" name="password" placeholder="Tạo mật khẩu..." required>
            </div>
            <button type="submit" class="btn-submit">Xác Nhận Đăng Ký</button>
        </form>
        
        <a href="{% url 'login' %}" class="switch-link">Đã có tài khoản? Quay lại đăng nhập</a>
    </div>
    </div> {% if success_msg %}
    <script>
        // 1. Hiện cửa sổ popup thông báo
        alert("🎉 {{ success_msg }}");
        
        // 2. Chuyển hướng người dùng về trang đăng nhập
        window.location.href = "{% url 'login' %}";
    </script>
    {% endif %}
</body>
</html>
