<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Hệ Thống An Ninh</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0f172a; margin-top: 0; margin-bottom: 25px; font-size: 24px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; color: #475569; display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input[type="password"]:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
        
        .btn-submit { width: 100%; background: #f59e0b; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #d97706; }
        
        .btn-back { display: inline-block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: bold; }
        .btn-back:hover { color: #0f172a; }
        
        .error-box { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>🔑 Đổi Mật Khẩu</h2>
        
        {% if error_msg %}
            <div class="error-box">⚠️ {{ error_msg }}</div>
        {% endif %}

        <form method="POST" action="{% url 'change_password' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Mật khẩu hiện tại:</label>
                <input type="password" name="old_password" required autofocus>
            </div>
            <div class="form-group">
                <label>Mật khẩu mới:</label>
                <input type="password" name="new_password" required>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới:</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn-submit">Cập Nhật Mật Khẩu</button>
        </form>
        
        <a href="{% url 'dashboard' %}" class="btn-back">🔙 Quay lại trang chủ</a>
    </div>

    {% if success_msg %}
    <script>
        alert("🎉 {{ success_msg }}");
        window.location.href = "{% url 'logout' %}";
    </script>
    {% endif %}
</body>
</html>
