{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
            <div class="flex items-center space-x-2">
                <span class="text-lg">🚨</span><h2 class="text-base font-semibold text-red-400">Lịch sử Sự kiện</h2>
            </div>
            <button onclick="loadEvents(1)" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700">🔄 Tải lại dữ liệu</button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-400">
                <thead class="text-xs uppercase bg-gray-950">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Thời gian</th>
                        <th class="px-4 py-3">Camera / Model</th>
                        <th class="px-4 py-3">Phân loại sự kiện</th>
                        <th class="px-4 py-3">Chi tiết Detections</th>
                        <th class="px-4 py-3">Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="event-list" class="divide-y divide-gray-800"></tbody>
            </table>
        </div>

        <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-800 text-sm text-gray-400">
            <span id="event-page-info" class="font-medium">Trang 1 / 1</span>
            <div class="flex space-x-2">
                <button onclick="changePage(-1)" class="px-4 py-2 bg-gray-800 rounded hover:bg-gray-700 transition-colors">◀ Trang trước</button>
                <button onclick="changePage(1)" class="px-4 py-2 bg-gray-800 rounded hover:bg-gray-700 transition-colors">Trang tiếp ▶</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentEventPage = 1;
    let totalEventPages = 1;

    document.addEventListener('DOMContentLoaded', () => loadEvents(1));

    async function loadEvents(page) {
        try {
            const res = await fetch(`/api/cloud/list_events?page=${page}&limit=10`); 
            if(!res.ok) return;
            const data = await res.json();
            
            currentEventPage = data.current_page || page;
            totalEventPages = data.total_pages || 1;
            document.getElementById('event-page-info').innerText = `Trang ${currentEventPage} / ${totalEventPages}`;
            
            const tbody = document.getElementById('event-list');
            tbody.innerHTML = '';
            
            if (!data.events || data.events.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 italic text-gray-500">Chưa có sự kiện nào được ghi nhận.</td></tr>`;
                return;
            }

            data.events.forEach(ev => {
                let detectionHtml = "-";
                if (ev.detections) {
                    try {
                        const detObj = typeof ev.detections === 'string' ? JSON.parse(ev.detections) : ev.detections;
                        detectionHtml = `<pre class="text-[10px] text-gray-500 overflow-hidden text-ellipsis max-w-xs">${JSON.stringify(detObj)}</pre>`;
                    } catch(e) {}
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-850/50">
                        <td class="px-4 py-3 font-mono text-gray-300">#${ev.id}</td>
                        <td class="px-4 py-3 text-xs text-gray-400">${ev.created_at ? new Date(ev.created_at).toLocaleString('vi-VN') : 'Đang cập nhật'}</td>
                        <td class="px-4 py-3 text-xs font-mono">
                            CAM: <span class="text-blue-400">${ev.camera_id}</span><br>
                            MDL: <span class="text-purple-400">${ev.model_id}</span>
                        </td>
                        <td class="px-4 py-3 text-red-400 font-semibold uppercase text-xs">${ev.event_type}</td>
                        <td class="px-4 py-3">${detectionHtml}</td>
                        <td class="px-4 py-3">
                            <span class="${ev.status === 'pending' ? 'bg-yellow-900/40 text-yellow-500' : 'bg-green-900/40 text-green-500'} px-2.5 py-1 rounded text-xs">
                                ${ev.status}
                            </span>
                        </td>
                    </tr>`;
            });
        } catch(e) { console.error("Lỗi tải sự kiện:", e); }
    }

    function changePage(step) {
        let newPage = currentEventPage + step;
        if(newPage >= 1 && newPage <= totalEventPages) {
            loadEvents(newPage);
        }
    }
</script>
{% endblock %}
