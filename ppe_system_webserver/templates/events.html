{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg relative">
        <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
            <div class="flex items-center space-x-2">
                <span class="text-lg">🚨</span><h2 class="text-base font-semibold text-red-400">Lịch sử Sự kiện</h2>
            </div>
            <button onclick="loadEvents(1)" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 transition-colors">🔄 Tải lại dữ liệu</button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-400">
                <thead class="text-xs uppercase bg-gray-950 text-gray-400">
                    <tr>
                        <th class="px-4 py-3">Mã SV / ID</th>
                        <th class="px-4 py-3">Thời gian</th>
                        <th class="px-4 py-3">Cam/Model</th>
                        <th class="px-4 py-3">Phân loại</th>
                        <th class="px-4 py-3 text-center">Hình ảnh</th>
                        <th class="px-4 py-3 text-center">Detections</th>
                        <th class="px-4 py-3 text-center">Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="event-list" class="divide-y divide-gray-800"></tbody>
            </table>
        </div>

        <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-800 text-sm text-gray-400">
            <span id="event-page-info" class="font-medium">Trang 1 / 1</span>
            <div class="flex space-x-2">
                <button onclick="changePage(-1)" class="px-4 py-2 bg-gray-800 rounded hover:bg-gray-700 transition-colors">◀ Trang trước</button>
                <button onclick="changePage(1)" class="px-4 py-2 bg-gray-800 rounded hover:bg-gray-700 transition-colors">Trang tiếp ▶</button>
            </div>
        </div>
    </div>
</div>

<!-- Cửa sổ nổi (Modal) xem Hình ảnh -->
<div id="imageModal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
    <div class="relative max-w-4xl w-full p-4 flex flex-col items-center">
        <button onclick="closeImageModal()" class="absolute -top-6 right-4 text-gray-300 hover:text-white text-4xl font-bold drop-shadow-md transition-colors">&times;</button>
        <img id="modalImg" src="" alt="Event Image" class="max-w-full max-h-[80vh] object-contain rounded-lg border border-gray-700 shadow-2xl bg-black">
    </div>
</div>

<!-- Cửa sổ nổi (Modal) xem Log JSON -->
<div id="jsonModal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
    <div class="bg-gray-900 w-full max-w-2xl rounded-xl border border-gray-700 shadow-2xl overflow-hidden flex flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-800 bg-gray-950">
            <h3 class="text-sm font-semibold text-blue-400">📋 Chi tiết Detections</h3>
            <button onclick="closeJsonModal()" class="text-gray-400 hover:text-red-500 text-2xl font-bold leading-none transition-colors">&times;</button>
        </div>
        <div class="p-4 overflow-auto max-h-[60vh] bg-gray-950/50 custom-scrollbar">
            <pre id="jsonContent" class="text-xs text-green-400 font-mono whitespace-pre-wrap"></pre>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentEventPage = 1;
    let totalEventPages = 1;

    document.addEventListener('DOMContentLoaded', () => loadEvents(1));

    async function loadEvents(page) {
        try {
            const res = await fetch(`/api/cloud/list_events?page=${page}&limit=10`); 
            if(!res.ok) return;
            const data = await res.json();
            
            currentEventPage = data.current_page || page;
            totalEventPages = data.total_pages || 1;
            document.getElementById('event-page-info').innerText = `Trang ${currentEventPage} / ${totalEventPages}`;
            
            const tbody = document.getElementById('event-list');
            tbody.innerHTML = '';
            
            if (!data.events || data.events.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 italic text-gray-500">Chưa có sự kiện nào được ghi nhận.</td></tr>`;
                return;
            }

            data.events.forEach(ev => {
                // Xử lý mã ID dài (hiển thị 8 ký tự đầu)
                const fullId = ev.code_event || ev.id || "N/A";
                const displayId = String(fullId).length > 12 ? String(fullId).substring(0, 8) + "..." : fullId;

                // Xử lý cột Hình ảnh
                let imgHtml = ev.image_path 
                    ? `<img src="${ev.image_path}" onclick="openImageModal('${ev.image_path}')" class="h-10 w-16 object-cover rounded cursor-pointer hover:opacity-75 border border-gray-700 mx-auto transition-opacity" title="Bấm để phóng to">` 
                    : `<span class="text-gray-600 text-[10px] italic">Chờ tải...</span>`;

                // Xử lý cột JSON Detections
                let logBtn = `<span class="text-gray-600 text-xs">-</span>`;
                if (ev.detections && (Array.isArray(ev.detections) ? ev.detections.length > 0 : Object.keys(ev.detections).length > 0)) {
                    const rawJson = typeof ev.detections === 'string' ? ev.detections : JSON.stringify(ev.detections);
                    const safeEncodedJson = encodeURIComponent(rawJson);
                    logBtn = `<button onclick="openJsonModal('${safeEncodedJson}')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-blue-500 text-blue-400 px-3 py-1.5 rounded text-xs transition-all shadow-sm">Xem Log</button>`;
                }

                // Tô màu trạng thái
                const statusBadge = ev.status === 'pending' 
                    ? 'bg-yellow-900/40 text-yellow-500 border-yellow-800/50' 
                    : 'bg-green-900/40 text-green-500 border-green-800/50';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-850/50 border-b border-gray-800/30">
                        <td class="px-4 py-3 font-mono text-gray-400 text-xs" title="${fullId}">#${displayId}</td>
                        <td class="px-4 py-3 text-xs text-gray-400">${ev.created_at ? new Date(ev.created_at).toLocaleString('vi-VN') : 'Đang cập nhật'}</td>
                        <td class="px-4 py-3 text-xs font-mono text-gray-500">
                            CAM: <span class="text-blue-400">${ev.camera_id}</span><br>
                            MDL: <span class="text-purple-400">${ev.model_id !== null ? ev.model_id : 'null'}</span>
                        </td>
                        <td class="px-4 py-3 text-red-400 font-semibold uppercase text-xs">${ev.event_type}</td>
                        <td class="px-4 py-3 text-center">${imgHtml}</td>
                        <td class="px-4 py-3 text-center">${logBtn}</td>
                        <td class="px-4 py-3 text-center">
                            <span class="${statusBadge} border px-2.5 py-1 rounded text-xs">
                                ${ev.status}
                            </span>
                        </td>
                    </tr>`;
            });
        } catch(e) { console.error("Lỗi tải sự kiện:", e); }
    }

    function changePage(step) {
        let newPage = currentEventPage + step;
        if(newPage >= 1 && newPage <= totalEventPages) {
            loadEvents(newPage);
        }
    }

    // ==========================================
    // CÁC HÀM ĐIỀU KHIỂN CỬA SỔ NỔI (MODAL)
    // ==========================================

    function openImageModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeImageModal() {
        document.getElementById('imageModal').classList.add('hidden');
        setTimeout(() => document.getElementById('modalImg').src = "", 200); // Đợi hiệu ứng đóng xong mới xóa src
    }

    function openJsonModal(encodedJson) {
        try {
            const decodedStr = decodeURIComponent(encodedJson);
            const parsedObj = JSON.parse(decodedStr);
            document.getElementById('jsonContent').textContent = JSON.stringify(parsedObj, null, 2);
        } catch (error) {
            document.getElementById('jsonContent').textContent = "Không có dữ liệu hợp lệ.";
        }
        document.getElementById('jsonModal').classList.remove('hidden');
    }

    function closeJsonModal() {
        document.getElementById('jsonModal').classList.add('hidden');
    }

    // Đóng Modal khi bấm phím ESC
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeImageModal();
            closeJsonModal();
        }
    });
</script>

<style>
    /* Làm đẹp thanh cuộn cho Modal JSON */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111827; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4B5563; }
</style>
{% endblock %}
