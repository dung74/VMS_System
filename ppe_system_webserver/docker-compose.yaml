# ==============================================================================
# LƯU Ý QUAN TRỌNG TRƯỚC KHI CHẠY:
# Hệ thống Edge và Cloud sử dụng chung một mạng lưới để giao tiếp với nhau.
# Do đó, bạn BẮT BUỘC phải tạo mạng này bằng tay trước khi chạy Docker Compose.
#
# Hãy copy và chạy lệnh dưới đây vào Terminal:
# docker network create ppe_shared_net
# ==============================================================================

services:
  web_db:
    image: postgres:13
    container_name: web_db
    env_file:
      - .env
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - web_pgdata:/var/lib/postgresql/data
    networks:
      - ppe_shared_net
  
  web_mqtt:
    image: eclipse-mosquitto:2.0
    container_name: web_mqtt
    ports:
      - "${MQTT_HOST_PORT:-1884}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - ./mosquitto.conf:/mosquitto-no-auth.conf
    networks:
      - ppe_shared_net

  cloud_api:
    build: .
    container_name: cloud_api
    ports:
      - "${CLOUD_API_PORT:-8000}:8000"
    depends_on:
      - web_db
      - web_mqtt
    env_file:
      - .env
    volumes:
      - ./static_images:/app/static_images
    networks:
      - ppe_shared_net

volumes:
  web_pgdata:

networks:
  ppe_shared_net:
    external: true